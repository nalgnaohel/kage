syntax = "proto3";

package kage.data;

option go_package = "kage/rpc/data";

service KageDataService {
  // Discovery: Used by clients to locate partition leaders
  rpc GetMetadata(MetadataRequest) returns (MetadataResponse);

  // Producer: Append records to the log
  rpc Produce(ProduceRequest) returns (ProduceResponse);

  // Consumer: Pull records from the log with long-polling support
  rpc Fetch(FetchRequest) returns (FetchResponse);

  // Offset Management: Persist consumer progress
  rpc CommitOffset(OffsetCommitRequest) returns (OffsetCommitResponse);
  rpc GetOffset(OffsetFetchRequest) returns (OffsetFetchResponse);

  // Utility: Retrieve boundary offsets
  rpc ListOffsets(ListOffsetsRequest) returns (ListOffsetsResponse);
}

// --- Metadata ---

message MetadataRequest {
  repeated string topics = 1;
}

message MetadataResponse {
  repeated Broker brokers = 1;
  repeated TopicMetadata topics = 2;
}

message Broker {
  int32 id = 1;
  string host = 2;
  int32 port = 3;
}

message TopicMetadata {
  string topic = 1;
  repeated PartitionMetadata partitions = 2;
}

message PartitionMetadata {
  int32 partition_id = 1;
  int32 leader_id = 2;
  repeated int32 replicas = 3;
  repeated int32 isr = 4;
}

// --- Produce ---

message ProduceRequest {
  string topic = 1;
  int32 partition = 2;

  // acks: 0 (none), 1 (leader only), -1 (all ISR/Raft quorum)
  int32 required_acks = 3;
  int32 timeout_ms = 4;

  repeated Record records = 5;
}

message Record {
  bytes key = 1;
  bytes value = 2;
  int64 timestamp = 3;
  map<string, string> headers = 4;
}

message ProduceResponse {
  int64 base_offset = 1;
  int64 timestamp = 2;
  string error_code = 3;
}

// --- Fetch ---

message FetchRequest {
  string topic = 1;
  int32 partition = 2;
  int64 fetch_offset = 3;

  int32 max_bytes = 4;
  int32 min_bytes = 5;
  int32 max_wait_ms = 6;
}

message FetchResponse {
  repeated FetchRecord records = 1;
  int64 high_watermark = 2;
}

message FetchRecord {
  int64 offset = 1;
  bytes key = 2;
  bytes value = 3;
  int64 timestamp = 4;
  map<string, string> headers = 5;
}

// --- Offsets ---

message OffsetCommitRequest {
  string consumer_group = 1;
  string topic = 2;
  int32 partition = 3;
  int64 offset = 4;
  string metadata = 5;
}

message OffsetCommitResponse {
  bool success = 1;
}

message OffsetFetchRequest {
  string consumer_group = 1;
  string topic = 2;
  int32 partition = 3;
}

message OffsetFetchResponse {
  int64 offset = 1;
}

message ListOffsetsRequest {
  string topic = 1;
  int32 partition = 2;
  // -1: Latest, -2: Earliest
  int64 strategy = 3;
}

message ListOffsetsResponse {
  int64 offset = 1;
}