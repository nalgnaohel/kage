syntax = "proto3";

package kage.data;

option go_package = "kage/rpc/data";

service KageDataService {
  // Discovery: Used by clients to locate partition leaders
  rpc GetMetadata(MetadataRequest) returns (MetadataResponse);

  // Produce and Fetch moved to api/rawdata's raw TCP data plane for zero-copy
  // sendfile(2) support — see docs/zero-copy-plan.md and docs/zero-copy-design.md.

  // Offset Management: Persist consumer progress
  rpc CommitOffset(OffsetCommitRequest) returns (OffsetCommitResponse);
  rpc GetOffset(OffsetFetchRequest) returns (OffsetFetchResponse);

  // Utility: Retrieve boundary offsets
  rpc ListOffsets(ListOffsetsRequest) returns (ListOffsetsResponse);
}

// --- Metadata ---

message MetadataRequest {
  repeated string topics = 1;
}

message MetadataResponse {
  repeated Broker brokers = 1;
  repeated TopicMetadata topics = 2;
}

message Broker {
  int32 id = 1;
  string host = 2;
  int32 port = 3;
}

message TopicMetadata {
  string topic = 1;
  repeated PartitionMetadata partitions = 2;
}

message PartitionMetadata {
  int32 partition_id = 1;
  int32 leader_id = 2;
  repeated int32 replicas = 3;
  repeated int32 isr = 4;
}

// --- Offsets ---

message OffsetCommitRequest {
  string consumer_group = 1;
  string topic = 2;
  int32 partition = 3;
  int64 offset = 4;
  string metadata = 5;
}

message OffsetCommitResponse {
  bool success = 1;
}

message OffsetFetchRequest {
  string consumer_group = 1;
  string topic = 2;
  int32 partition = 3;
}

message OffsetFetchResponse {
  int64 offset = 1;
}

message ListOffsetsRequest {
  string topic = 1;
  int32 partition = 2;
  // -1: Latest, -2: Earliest
  int64 strategy = 3;
}

message ListOffsetsResponse {
  int64 offset = 1;
}