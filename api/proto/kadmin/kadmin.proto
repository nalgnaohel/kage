syntax = "proto3";

package kage.kadmin;

option go_package = "kage/rpc/kadmin";

service KafkaAdmin {
  rpc CreateTopic(CreateTopicRequest) returns (CreateTopicResponse);
  rpc DeleteTopic(DeleteTopicRequest) returns (DeleteTopicResponse);
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse);
  rpc DescribeTopic(DescribeTopicRequest) returns (DescribeTopicResponse);

  // Cluster Management
  rpc GetClusterInfo(GetClusterInfoRequest) returns (GetClusterInfoResponse);
  rpc JoinCluster(JoinClusterRequest) returns (JoinClusterResponse);
}

message CreateTopicRequest {
  string topic_name = 1;
  int32 num_partitions = 2;
  int32 replication_factor = 3;
}

message CreateTopicResponse {
  bool success = 1;
  string message = 2;
}

message DeleteTopicRequest {
  string topic_name = 1;
}

message DeleteTopicResponse {
  bool success = 1;
  string message = 2;
}

message ListTopicsRequest {}

message ListTopicsResponse {
  repeated string topics = 1;
}

message DescribeTopicRequest {
  string topic_name = 1;
}

message DescribeTopicResponse {
  string topic_name = 1;
  int32 num_partitions = 2;
  int32 replication_factor = 3;
  map<int32, PartitionInfo> partitions = 4;
}

message PartitionInfo {
  int32 partition_id = 1;
  int32 leader = 2;
  repeated int32 replicas = 3;
  repeated int32 isr = 4; // In-Sync Replicas
}

message GetClusterInfoRequest {}

message GetClusterInfoResponse {
  string cluster_id = 1;
  repeated BrokerInfo brokers = 2;
}

message BrokerInfo {
  int32 broker_id = 1;
  string host = 2;
  int32 port = 3;
}

message JoinClusterRequest {
  int32 broker_id = 1;
  string host = 2;
  int32 port = 3;
  string raft_addr = 4;
  string raw_addr = 5;
}

message JoinClusterResponse {
  bool success = 1;
  string message = 2;
}