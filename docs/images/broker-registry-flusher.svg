<svg viewBox="0 0 1240 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1080" fill="#ffffff"/>

  <text x="620" y="28" font-size="19" font-weight="700" text-anchor="middle" fill="#0f172a">Broker: Registry (bookkeeping đĩa) + Flusher (group-commit)</text>

  <!-- ================= Section A: Registry ================= -->
  <rect x="40" y="45" width="1160" height="270" rx="10" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="72" font-size="15" font-weight="600" fill="#0f172a">Registry — map topic/partition → *storage.Log + *Flusher; chỉ bookkeeping đĩa cục bộ</text>

  <rect x="70" y="110" width="260" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="200" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">raft.Reconciler</text>
  <text x="200" y="148" text-anchor="middle" font-size="11" fill="#334155">(diff Raft state vs đĩa)</text>

  <rect x="910" y="95" width="260" height="45" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="1040" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">api/rawdata Produce</text>
  <text x="1040" y="130" text-anchor="middle" font-size="11" fill="#334155">(handleProduce)</text>

  <rect x="910" y="160" width="260" height="45" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="1040" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">api/rawdata Fetch</text>
  <text x="1040" y="195" text-anchor="middle" font-size="11" fill="#334155">(handleFetch)</text>

  <rect x="420" y="95" width="400" height="150" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="620" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Registry</text>
  <text x="620" y="145" text-anchor="middle" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#1e293b">logs: map[topic]map[partition]*storage.Log</text>
  <text x="620" y="168" text-anchor="middle" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#1e293b">flushers: map[topic]map[partition]*Flusher</text>
  <text x="620" y="192" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">(GetFlusher: lazy-create, double-checked lock)</text>

  <line x1="330" y1="135" x2="420" y2="135" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="129" text-anchor="middle" font-size="10" fill="#334155">CreateLog/GetLog</text>

  <line x1="910" y1="117" x2="820" y2="117" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="865" y="111" text-anchor="middle" font-size="10" fill="#334155">GetFlusher(...)</text>

  <line x1="910" y1="182" x2="820" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="865" y="176" text-anchor="middle" font-size="10" fill="#334155">GetLog(...)</text>

  <text x="70" y="272" font-size="12.5" fill="#334155">Startup(): eager-load mọi partition dir có sẵn dưới baseDir khi khởi động</text>
  <text x="70" y="292" font-size="12.5" fill="#334155">Thư mục đĩa: &lt;topic&gt;-&lt;partition&gt;/ (split ở dash CUỐI — topic có thể chứa dash)</text>

  <line x1="620" y1="315" x2="620" y2="355" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="340" font-size="12.5" font-style="italic" fill="#64748b">zoom into 1 Flusher (mỗi partition có 1, lazy-create qua GetFlusher)</text>

  <!-- ================= Section B: Flusher pipeline ================= -->
  <rect x="40" y="360" width="1160" height="690" rx="10" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="387" font-size="15" font-weight="600" fill="#0f172a">Flusher — async batching writer (group-commit), 1 instance / partition</text>

  <rect x="90" y="405" width="220" height="55" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="200" y="427" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Producer A</text>
  <text x="200" y="444" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Push(v) → own resultChan</text>

  <rect x="510" y="405" width="220" height="55" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="620" y="427" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Producer B</text>
  <text x="620" y="444" text-anchor="middle" font-size="10.5" fill="#4c1d95">Push(v) → own resultChan</text>

  <rect x="930" y="405" width="220" height="55" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="1040" y="427" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Producer C</text>
  <text x="1040" y="444" text-anchor="middle" font-size="10.5" fill="#78350f">Push(v) → own resultChan</text>

  <line x1="200" y1="460" x2="200" y2="500" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="460" x2="620" y2="500" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="460" x2="1040" y2="500" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="90" y="500" width="1060" height="50" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="620" y="520" text-anchor="middle" font-size="13" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#0f172a">incomingQueue — chan BatchItem, buffered cap=4096</text>
  <text x="620" y="538" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">1 consumer duy nhất đọc tuần tự: goroutine run()</text>

  <line x1="620" y1="550" x2="620" y2="590" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="590" width="400" height="55" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="620" y="612" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">run(): for-select loop</text>
  <text x="620" y="630" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#334155">accumulate vào currentBatch []BatchItem</text>

  <line x1="620" y1="645" x2="320" y2="680" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="645" x2="920" y2="680" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="150" y="680" width="340" height="55" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="703" text-anchor="middle" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#0f172a">len(currentBatch) ≥ batchSize</text>
  <text x="320" y="721" text-anchor="middle" font-size="10.5" font-style="italic" fill="#475569">flush ngay, reset ticker</text>

  <rect x="750" y="680" width="340" height="55" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="920" y="703" text-anchor="middle" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#0f172a">ticker.C fires (lingerTime)</text>
  <text x="920" y="721" text-anchor="middle" font-size="10.5" font-style="italic" fill="#475569">chỉ flush nếu len(currentBatch) &gt; 0</text>

  <line x1="320" y1="735" x2="620" y2="770" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="735" x2="620" y2="770" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="770" width="400" height="55" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="620" y="792" text-anchor="middle" font-size="12" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#0f172a">flushBatch(batch)</text>
  <text x="620" y="810" text-anchor="middle" font-size="11" fill="#334155">currentBatch = nil; for mỗi item trong batch:</text>

  <line x1="620" y1="825" x2="620" y2="855" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="855" width="400" height="55" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="620" y="878" text-anchor="middle" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#0f172a">offset, err := log.Append(item.Value)</text>
  <text x="620" y="896" text-anchor="middle" font-size="10.5" fill="#334155">ghi xuống storage.Log của chính partition này</text>

  <line x1="620" y1="910" x2="620" y2="935" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="370" y="935" width="500" height="95" rx="8" fill="#fefce8" stroke="#334155" stroke-width="2"/>
  <text x="620" y="957" text-anchor="middle" font-size="12" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#0f172a">item.ResultChan &lt;- AppendResult{Offset, Error}</text>

  <rect x="493" y="968" width="14" height="14" fill="#2563eb"/>
  <text x="500" y="1000" text-anchor="middle" font-size="10.5" fill="#1e293b">→ Producer A</text>

  <rect x="613" y="968" width="14" height="14" fill="#6d28d9"/>
  <text x="620" y="1000" text-anchor="middle" font-size="10.5" fill="#1e293b">→ Producer B</text>

  <rect x="733" y="968" width="14" height="14" fill="#b45309"/>
  <text x="740" y="1000" text-anchor="middle" font-size="10.5" fill="#1e293b">→ Producer C</text>

  <text x="620" y="1020" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">mỗi item unblock NGAY khi tới lượt nó flush — không chờ hết batch của 2 item khác</text>
</svg>
